[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-daemon-engine"
version = "0.0.1"
description = "MCP daemon business logic with gateway dispatch entry points"
authors = [{name = "Idea Bosque"}]
dependencies = [
  "mcp>=2.0,<3.0",
  "python-jose[cryptography]",
  "httpx[http2]",
  "bcrypt",
  "passlib[bcrypt]",
  "graphene",
  "python-dotenv",
  "pendulum",
  "SilvaEngine-DynamoDB-Base",
  "SilvaEngine-Utility",
  "mcp-http-client",
  "aiohttp",
]

[project.optional-dependencies]
dev = [
  "ruff",
]
postgresql = [
  "SQLAlchemy>=1.4",
  "psycopg2-binary>=2.9",
  "alembic>=1.10",
]

[tool.setuptools.packages.find]
# The repo root also has a top-level `migration/` (Alembic) directory, which
# setuptools' flat-layout auto-discovery can't disambiguate from the real
# package without this. Without it, `pip install git+https://...` (a fresh
# clone, no pre-built wheel) fails: "Multiple top-level packages discovered
# in a flat-layout: ['migration', 'mcp_daemon_engine']".
include = ["mcp_daemon_engine*"]

[tool.pytest.ini_options]
# Only collect this package's own tests. tests/tmp/ holds extracted package
# artifacts staged by manual processMcpPackage runs (gitignored) and must not
# be discovered as tests.
testpaths = ["mcp_daemon_engine/tests"]
norecursedirs = ["tmp", ".git", "build", "*.egg-info", ".ruff_cache", "__pycache__"]

[tool.pyright]
typeCheckingMode = "basic"
reportCallIssue = "none"
reportArgumentType = "none"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
